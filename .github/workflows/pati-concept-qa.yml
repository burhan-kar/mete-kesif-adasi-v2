name: Pati concept SVG quality gates
on:
  pull_request:
    paths:
      - "assets/concepts/pati-model-sheet-v01.svg"
      - "scripts/validate-pati-concept.mjs"
      - ".github/workflows/pati-concept-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  concept-static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify concept asset without paid dependencies
        run: node scripts/validate-pati-concept.mjs
