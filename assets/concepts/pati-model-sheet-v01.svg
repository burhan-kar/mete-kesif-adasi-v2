<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">Pati — dört açılı karakter konsept paftası v0.1</title>
<desc id="desc">Özgün köpek maskotu Pati: ön, sol profil, arka ve üç çeyrek taslak referans görünümü. Bu çizim 2D vektör taslaktır, 3D GLB model değildir.</desc>
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#EDF9FF"/><stop offset="1" stop-color="#FFF7E7"/></linearGradient>
  <linearGradient id="caramel" x1="0" y1="0" x2=".95" y2="1"><stop stop-color="#FAD29A"/><stop offset=".46" stop-color="#F5B66E"/><stop offset="1" stop-color="#DE8D4C"/></linearGradient>
  <linearGradient id="caramelSide" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8C786"/><stop offset="1" stop-color="#CB7E42"/></linearGradient>
  <linearGradient id="cream" x1=".12" x2="1" y1="0" y2="1"><stop stop-color="#FFFDF4"/><stop offset="1" stop-color="#F1DAB9"/></linearGradient>
  <radialGradient id="eye" cx=".36" cy=".25"><stop stop-color="#6D4034"/><stop offset=".8" stop-color="#3E2425"/><stop offset="1" stop-color="#2A1A1B"/></radialGradient>
  <linearGradient id="nose" y1="0" y2="1" x1="0" x2="1"><stop stop-color="#70504B"/><stop offset="1" stop-color="#38292C"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="9"/></filter>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#B1D8D7" opacity=".38"/></pattern>
  <style>
    text{font-family:Verdana,Arial,sans-serif;fill:#385061}
    .panel{fill:#FFFFFF;stroke:#DAEBEE;stroke-width:3}
    .outline{stroke:#AB704A;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
    .label{font-size:26px;font-weight:700}
    .sub{font-size:17px}
    .guide{stroke:#B5DADD;stroke-width:2;stroke-dasharray:8 12;opacity:.65}
  </style>
</defs>
